name: Weather Edge Tracker

on:
  schedule:
    # 09:30 CST (15:30 UTC)
    - cron: "30 15 * * *"
    # 12:00 CST (18:00 UTC)
    - cron: "0 18 * * *"
    # Nightly settlement sweep (02:15 CST)
    - cron: "15 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: weather-edge-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data dir exists
        run: |
          mkdir -p data

      - name: Run tracker
        env:
          # Required
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}

          # Provide BOTH; track.py/philly_edge.py will use what's available
          KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
          KALSHI_PRIVATE_KEY_B64: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}

          # (Optional) If you ever switch to path-based key, add a secret for it and uncomment:
          # KALSHI_PRIVATE_KEY_PATH: ${{ secrets.KALSHI_PRIVATE_KEY_PATH }}
        run: |
          python -c "import os; print('KEY_ID_SET=', bool(os.getenv('KALSHI_KEY_ID'))); print('PEM_LEN=', len(os.getenv('KALSHI_PRIVATE_KEY_PEM','').strip())); print('B64_LEN=', len(os.getenv('KALSHI_PRIVATE_KEY_B64','').strip()))"
          python track.py

      - name: Commit updated performance data
        run: |
          git config user.name "weather-edge-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/performance.csv data/cron_track.log || true

          git diff --cached --quiet && echo "No changes to commit." && exit 0

          git commit -m "Auto update performance data" || exit 0

          git pull --rebase origin main || true
          git push origin main || true
