name: Weather Edge Tracker

on:
  schedule:
    # 09:30 CST (15:30 UTC)
    - cron: "30 15 * * *"
    # 12:00 CST (18:00 UTC)
    - cron: "0 18 * * *"
    # Nightly settlement sweep (02:15 CST)
    - cron: "15 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        run: |
          python track.py

      - name: Commit updated performance data
        run: |
          git config user.name "weather-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/performance.csv data/cron_track.log || true
          git diff --cached --quiet || git commit -m "Auto update performance data"
          git push
